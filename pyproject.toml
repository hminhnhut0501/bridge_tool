[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-vault"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["Telethon>=1.43,<2", "cryptg==0.6.0", "psutil>=6,<8", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "argon2-cffi>=23,<26", "python-dotenv>=1,<2"]

[project.scripts]
telegram-vault = "telegram_vault.cli:main"

[tool.setuptools.packages.find]
include = ["telegram_vault*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
